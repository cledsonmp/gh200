<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulado GH-200 — Gerenciar ações e fluxos de trabalho</title><style>
:root{--ink:#24292f;--muted:#57606a;--line:#d0d7de;--soft:#f6f8fa;--blue:#0969da;--bs:#ddf4ff;--green:#1a7f37;--gs:#dafbe1;--red:#cf222e;--rs:#ffebe9}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{border-bottom:1px solid var(--line);padding:18px 24px}.top{max-width:940px;margin:auto;display:flex;gap:16px;align-items:center}.mark{width:46px;height:46px;border-radius:50%;background:#24292f;color:#fff;display:grid;place-items:center;font-weight:800}.title h1{font-size:20px;margin:0}.title p{margin:2px 0 0;color:var(--muted);font-size:14px}main{max-width:940px;margin:30px auto;padding:0 24px}.meta{display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:14px;margin-bottom:9px}.bar{height:8px;background:#eaeef2;border-radius:99px;overflow:hidden;margin-bottom:28px}.bar span{display:block;height:100%;background:var(--blue);transition:.25s}.card{border:1px solid var(--line);border-radius:8px;padding:28px}.eyebrow{color:var(--blue);font-weight:650;font-size:14px}.question{font-size:21px;line-height:1.38;margin:8px 0 18px}.hintbox{margin:0 0 18px;padding:12px 14px;background:#fff8c5;border:1px solid #d4a72c;border-radius:6px;color:#633c01}.hint-btn{margin:0 0 18px;border:0;background:none;color:var(--blue);font-weight:650;cursor:pointer;padding:0}.options{display:grid;gap:12px}.option{display:flex;align-items:flex-start;gap:12px;padding:15px;border:1px solid var(--line);border-radius:6px;cursor:pointer;white-space:pre-wrap}.option:hover{border-color:#8c959f;background:var(--soft)}.option.selected{border:2px solid var(--blue);padding:14px;background:var(--bs)}.option.correct{border:2px solid var(--green);padding:14px;background:var(--gs)}.option.wrong{border:2px solid var(--red);padding:14px;background:var(--rs)}.option.locked{cursor:default}.option input{margin-top:5px}.letter{font-weight:650;min-width:20px}.feedback{margin-top:20px;padding:16px 18px;border-radius:6px;border-left:5px solid var(--green);background:var(--gs)}.feedback.bad{border-left-color:var(--red);background:var(--rs)}.feedback h3{margin:0 0 5px;font-size:17px;color:var(--green)}.feedback.bad h3{color:var(--red)}.feedback p{margin:4px 0}.actions{display:flex;justify-content:flex-end;margin-top:24px}.btn{border:1px solid rgba(27,31,36,.15);border-radius:6px;padding:10px 20px;font-weight:650;cursor:pointer;background:#f6f8fa}.btn.primary{background:#1f883d;color:#fff;border-color:#1f883d}.btn:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}.result{text-align:center}.score{font-size:54px;font-weight:750;margin:8px 0;color:var(--blue)}.status{font-size:21px;font-weight:650}.summary{color:var(--muted);margin-bottom:24px}.review{margin-top:28px;text-align:left;display:grid;gap:14px}.review-item{border:1px solid var(--line);border-left:5px solid var(--green);padding:17px;border-radius:6px}.review-item.wrong{border-left-color:var(--red)}.review-item h3{font-size:16px;margin:0 0 7px}.review-item p{margin:4px 0;color:var(--muted)}.footer{text-align:center;color:var(--muted);font-size:13px;margin:26px 0}@media(max-width:640px){.card{padding:20px}.question{font-size:18px}.meta{flex-direction:column;gap:3px}}
</style></head><body><header><div class="top"><div class="mark">GH</div><div class="title"><h1>Simulado de Certificação GH-200</h1><p>Módulo 7 — Gerenciar ações e fluxos de trabalho</p></div></div></header><main><section id="quiz"><div class="meta"><span id="counter"></span><span>Correção antes de avançar</span></div><div class="bar"><span id="progress"></span></div><div class="card"><div class="eyebrow">QUESTÃO</div><h2 class="question" id="question"></h2><button id="hintBtn" class="hint-btn">Ver dica</button><div id="hint" class="hintbox hidden"></div><div class="options" id="options"></div><div id="feedback" class="feedback hidden"></div><div class="actions"><button class="btn primary" id="action" disabled>Próxima</button></div></div></section><section id="result" class="hidden"><div class="card result"><div class="eyebrow">RESULTADO FINAL</div><div class="score" id="score"></div><div class="status" id="status"></div><p class="summary" id="summary"></p><button class="btn primary" id="restart">Refazer simulado</button><div class="review" id="review"></div></div></section><div class="footer">Simulado independente para estudo da certificação GitHub Actions (GH-200).</div></main><script>
const questions=[
{q:'Em qual local um administrador configura a política corporativa de uso do GitHub Actions?',o:['Conta corporativa → Políticas → Ações','Repositório → Issues → Actions','Organização → Packages → Políticas','Perfil pessoal → Developer settings'],a:0,h:'A configuração está no nível enterprise, não em um repositório isolado.',e:'A política de uso do GitHub Actions é configurada na conta corporativa, em Políticas → Ações.'},
{q:'Em qual situação a política corporativa do GitHub Actions está disponível no GitHub Enterprise Server?',o:['Sempre, mesmo sem conexão externa','Somente com Enterprise Managed Users','Quando o GitHub Connect está habilitado','Apenas quando SCIM está desabilitado'],a:2,h:'No GHES, o recurso depende da integração com serviços do GitHub.com.',e:'No Enterprise Cloud a política está disponível; no Enterprise Server, depende do GitHub Connect habilitado.'},
{q:'O que controla a opção “Habilitar para todas as organizações” na política corporativa?',o:['Se os runners serão Linux ou Windows','Se todas, algumas ou nenhuma organização poderá usar Actions','Quais branches podem receber pull requests','Se os pacotes serão públicos ou privados'],a:1,h:'A opção define o alcance organizacional do recurso.',e:'Essa configuração permite liberar o GitHub Actions para todas, para algumas ou para nenhuma organização da empresa.'},
{q:'Uma empresa quer bloquear ações desconhecidas do Marketplace, mas permitir ações internas e uma lista aprovada de terceiros. Qual estratégia é adequada?',o:['Permitir irrestritamente todas as ações públicas','Desabilitar Actions em toda a empresa','Permitir ações empresariais e configurar ações não empresariais específicas','Permitir somente workflows sem uses'],a:2,h:'A política separa conteúdo interno de ações externas autorizadas.',e:'É possível permitir ações empresariais e workflows reutilizáveis internos, liberando apenas ações externas específicas.'},
{q:'Em um GHES, a empresa quer sincronizar ações aprovadas manualmente em vez de permitir acesso automático ao Marketplace. Qual ferramenta é indicada?',o:['actions-sync','actions/cache','workflow_dispatch','github-script'],a:0,h:'O nome da ferramenta descreve diretamente a sincronização de ações.',e:'A ferramenta actions-sync permite baixar e sincronizar manualmente ações aprovadas para a instância GHES.'},
{q:'Onde são listadas as ações disponíveis em uma instância GitHub Enterprise Server?',o:['https://HOSTNAME/packages','https://github.com/HOSTNAME/workflows','https://HOSTNAME/marketplace/actions','https://HOSTNAME/actions'],a:3,h:'O caminho usa diretamente o nome do recurso após o hostname.',e:'A imagem indica https://HOSTNAME/actions como endereço para visualizar as ações da instância.'},
{q:'Qual conjunto representa práticas recomendadas para documentar padrões corporativos de Actions?',o:['Apenas nomes dos administradores e senhas de runners','Repositórios de armazenamento, nomenclatura, componentes compartilhados, manutenção e contribuição','Somente licenças e custos de minutos','Somente exemplos de Dockerfile'],a:1,h:'A documentação deve orientar onde encontrar, como nomear e como manter recursos reutilizáveis.',e:'Uma wiki ou Markdown corporativo deve registrar armazenamento, nomenclatura, localização de componentes, manutenção e diretrizes de contribuição.'},
{q:'Quais dois arquivos, com o mesmo nome-base, formam um template de workflow organizacional?',o:['ci.yml e ci.properties.json','action.yml e package.json','workflow.yml e settings.json','ci.yaml e action.properties'],a:0,h:'Um arquivo contém o workflow; o outro descreve como ele aparece na lista de templates.',e:'No repositório público .github, workflow-templates contém o YAML e o arquivo de propriedades correspondente, como ci.yml e ci.properties.json.'},
{q:'No arquivo .properties.json de um template, quais parâmetros são obrigatórios?',o:['iconName e categories','categories e filePatterns','description e iconName','name e description'],a:3,h:'São os dois textos básicos exibidos ao usuário na lista.',e:'name e description são obrigatórios; iconName, categories e filePatterns são opcionais.'},
{q:'Um arquivo ci.yml declara on: workflow_call, recebe node-version e exige o segredo npm-token. Como outro repositório deve chamá-lo?',o:['run: org/reusable-workflows/ci.yml --node 16','uses: org/reusable-workflows/.github/workflows/ci.yml@v1, com with e secrets','uses: org/actions/ci.yml sem referência','workflow: ci.yml com env apenas'],a:1,h:'Workflows reutilizáveis usam uses com caminho completo e uma ref após @.',e:'workflow_call torna o fluxo reutilizável. O chamador usa owner/repo/.github/workflows/arquivo@ref, fornece entradas em with e segredos em secrets.'}
];
let current=0,selected=null,revealed=false,answers=[];const $=id=>document.getElementById(id);const safe=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function render(){const x=questions[current];$('counter').textContent=`Questão ${current+1} de 10`;$('progress').style.width=`${(current+1)*10}%`;$('question').textContent=x.q;$('hint').textContent=x.h;$('hint').classList.add('hidden');$('hintBtn').textContent='Ver dica';$('hintBtn').classList.remove('hidden');$('feedback').className='feedback hidden';$('options').innerHTML=x.o.map((v,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"><span class="letter">${'ABCD'[i]}.</span><span>${safe(v)}</span></label>`).join('');document.querySelectorAll('input[name=answer]').forEach(el=>el.onchange=()=>{selected=+el.value;document.querySelectorAll('.option').forEach((n,i)=>n.classList.toggle('selected',i===selected));$('action').disabled=false});$('action').textContent='Próxima';$('action').disabled=true}
$('hintBtn').onclick=()=>{$('hint').classList.toggle('hidden');$('hintBtn').textContent=$('hint').classList.contains('hidden')?'Ver dica':'Ocultar dica'};
function reveal(){revealed=true;answers[current]=selected;const x=questions[current],ok=selected===x.a;document.querySelectorAll('.option').forEach((n,i)=>{n.classList.remove('selected');n.classList.add('locked');n.querySelector('input').disabled=true;if(i===x.a)n.classList.add('correct');else if(i===selected)n.classList.add('wrong')});$('hintBtn').classList.add('hidden');$('hint').classList.add('hidden');const f=$('feedback');f.className=`feedback ${ok?'':'bad'}`;f.innerHTML=`<h3>${ok?'Resposta correta':'Resposta incorreta'}</h3><p><strong>Alternativa correta: ${'ABCD'[x.a]}.</strong> ${safe(x.o[x.a])}</p><p>${x.e}</p>`;$('action').textContent=current===9?'Ver resultado':'Continuar'}
function advance(){if(!revealed)return reveal();if(current<9){current++;selected=null;revealed=false;render();scrollTo({top:0,behavior:'smooth'})}else finish()}
function finish(){const hits=answers.reduce((n,v,i)=>n+(v===questions[i].a),0),pct=hits*10;$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=pct+'%';$('status').textContent=pct>=70?'Desempenho satisfatório':'Continue revisando';$('summary').textContent=`Você acertou ${hits} de 10 questões.`;$('review').innerHTML=questions.map((x,i)=>`<article class="review-item ${answers[i]===x.a?'':'wrong'}"><h3>${i+1}. ${x.q}</h3><p><strong>${answers[i]===x.a?'Correta':'Incorreta'}.</strong> Resposta: ${'ABCD'[x.a]}. ${safe(x.o[x.a])}</p><p>${x.e}</p></article>`).join('');scrollTo({top:0,behavior:'smooth'})}
$('action').onclick=advance;$('restart').onclick=()=>{current=0;selected=null;revealed=false;answers=[];$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render();scrollTo(0,0)};render();
</script></body></html>
