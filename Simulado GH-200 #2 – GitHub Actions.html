<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulado GH-200 – GitHub Actions #2</title>
<style>
:root{color-scheme:light}
html,body{background:#fff;color:#1f2328;margin:0;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:#59636e;margin:0 0 20px;font-size:14px}
.q{border:1px solid #d1d9e0;border-radius:10px;padding:16px;margin-bottom:16px;background:#fff}
.q h2{font-size:15px;margin:0 0 12px;line-height:1.45}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid #d1d9e0;border-radius:8px;padding:10px 12px;margin:6px 0;font-size:14px;cursor:pointer;color:#1f2328;line-height:1.4}
.opt:hover:not(:disabled){background:#f6f8fa}
.opt:disabled{cursor:default}
.opt.ok{background:#dafbe1;border-color:#1a7f37}
.opt.bad{background:#ffebe9;border-color:#cf222e}
.exp{display:none;margin-top:10px;padding:10px 12px;border-radius:8px;background:#f6f8fa;font-size:13.5px;line-height:1.5}
code{background:#eaeef2;padding:1px 5px;border-radius:4px;font-size:12.5px}
#score{display:none;text-align:center;font-size:18px;font-weight:600;padding:16px;border:2px solid #0969da;border-radius:10px}
button.r{margin-top:12px;padding:8px 16px;border:1px solid #d1d9e0;background:#fff;border-radius:8px;cursor:pointer}
</style></head><body><main>
<h1>Simulado GH-200 · GitHub Actions #2</h1>
<p class="sub">10 questões · clique na alternativa para ver a correção imediata.</p>
<div id="qs"></div>
<div id="score"></div>
<script>
const Q=[
{q:"Qual é a forma mais segura de referenciar uma action de terceiros para reduzir risco de supply chain?",
o:["uses: org/action@main","uses: org/action@v3","uses: org/action@latest","uses: org/action@&lt;SHA completo do commit&gt;"],a:3,
e:"Tags e branches são mutáveis: quem controla o repositório pode mover <code>v3</code> ou <code>main</code> para código malicioso. Somente o SHA completo do commit é imutável. <code>@latest</code> nem é uma referência padrão."},
{q:"Você quer que apenas um deploy rode por vez no grupo <code>production</code>, cancelando execuções antigas quando uma nova começar. O que usar?",
o:["concurrency: { group: production, cancel-in-progress: true }","strategy: { max-parallel: 1 }","needs: production","timeout-minutes: 1"],a:0,
e:"<code>concurrency</code> com <code>group</code> e <code>cancel-in-progress</code> controla execuções simultâneas entre runs. <code>max-parallel</code> só limita jobs de uma matriz dentro de uma mesma run."},
{q:"Um step de limpeza deve rodar sempre: após sucesso, falha ou cancelamento do workflow. Qual configuração usar?",
o:["if: success()","if: failure()","if: always()","continue-on-error: true"],a:2,
e:"<code>always()</code> executa o step em qualquer situação. <code>failure()</code> só roda se algo falhou, e <code>continue-on-error</code> apenas impede que a falha do próprio step derrube o job; não faz o step rodar após falha anterior."},
{q:"Sobre workflows com o gatilho <code>schedule</code> (cron), qual afirmação está correta?",
o:["Rodam na branch do último push, no fuso configurado no repositório","Rodam na branch padrão, em horário UTC","Rodam em todas as branches, em horário UTC","Rodam na branch padrão, no fuso do runner"],a:1,
e:"Workflows agendados rodam sempre no último commit da branch padrão e o cron é interpretado em UTC. Também podem sofrer atraso em horários de alta carga."},
{q:"Como evitar que um <code>push</code> dispare o workflow quando somente arquivos dentro de <code>docs/</code> foram alterados?",
o:["branches-ignore: docs/**","paths: docs/**","tags-ignore: docs/**","paths-ignore: docs/**"],a:3,
e:"<code>paths-ignore</code> impede a execução se todos os arquivos alterados casarem com o padrão. <code>paths: docs/**</code> faz o contrário: roda apenas quando algo em docs muda."},
{q:"Qual é a forma recomendada de passar arquivos gerados (ex.: um binário compilado) de um job para outro job do mesmo workflow?",
o:["actions/cache com a mesma key nos dois jobs","Declarar o conteúdo como output do job","actions/upload-artifact e actions/download-artifact","Gravar em $GITHUB_WORKSPACE e ler no outro job"],a:2,
e:"Cada job roda em um runner limpo. Artifacts servem para compartilhar arquivos entre jobs. Cache é para acelerar dependências (sem garantia de existir) e outputs são para valores pequenos de texto."},
{q:"Um step gera um valor sensível em tempo de execução e você quer que ele seja mascarado nos logs. Qual comando usar?",
o:["echo \"::add-mask::$VALOR\"","echo \"::hide::$VALOR\"","set +x","echo \"$VALOR\" >> $GITHUB_ENV"],a:0,
e:"O workflow command <code>::add-mask::</code> faz o runner substituir o valor por <code>***</code> nos logs seguintes. Gravar em <code>GITHUB_ENV</code> não mascara nada."},
{q:"Seu workflow faz <code>git push</code> usando o <code>GITHUB_TOKEN</code> padrão, mas outro workflow com <code>on: push</code> não é disparado. Qual a solução?",
o:["Adicionar permissions: contents: write","Usar um PAT ou token de GitHub App no checkout/push","Habilitar \"allow recursive workflows\" nas configurações","Trocar o evento do outro workflow para workflow_call"],a:1,
e:"Eventos gerados pelo <code>GITHUB_TOKEN</code> não disparam novos workflows (exceto <code>workflow_dispatch</code> e <code>repository_dispatch</code>), para evitar loops. Um PAT ou token de GitHub App contorna isso."},
{q:"Um job roda diretamente na VM do runner (sem <code>container:</code>) e usa um service container PostgreSQL com <code>ports: 5432:5432</code>. Qual host o job deve usar para conectar?",
o:["postgres (o label do service)","0.0.0.0","host.docker.internal","localhost"],a:3,
e:"Quando o job roda direto no runner, o service é acessado via <code>localhost</code> na porta mapeada. O nome do label (<code>postgres</code>) só funciona como hostname quando o job também roda em um container na mesma rede Docker."},
{q:"Como habilitar logs de debug detalhados por step em um repositório?",
o:["Definir env ACTIONS_DEBUG_LOG: true no workflow","Criar secret ou variable ACTIONS_STEP_DEBUG com valor true","Definir RUNNER_DEBUG: 1 no workflow","Adicionar debug: true no step"],a:1,
e:"Criar o secret ou a variable <code>ACTIONS_STEP_DEBUG=true</code> ativa o debug de steps (também há a opção \"Re-run with debug logging\"). <code>RUNNER_DEBUG</code> é uma variável definida pelo runner quando o debug está ativo, não algo que você configura para ativá-lo."}
];

let hits=0,done=0;
const box=document.getElementById('qs');
Q.forEach((it,i)=>{
 const d=document.createElement('div');d.className='q';
 d.innerHTML='<h2>'+(i+1)+'. '+it.q+'</h2>';
 const L='ABCD';
 it.o.forEach((t,j)=>{
  const b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+L[j]+')</b> '+t;
  b.onclick=()=>{
   d.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(k===it.a)x.classList.add('ok')});
   if(j!==it.a)b.classList.add('bad');else hits++;
   ex.style.display='block';
   ex.innerHTML=(j===it.a?'✅ <b>Correto!</b> ':'❌ <b>Errado.</b> Resposta certa: <b>'+L[it.a]+'</b>. ')+it.e;
   if(++done===Q.length){const s=document.getElementById('score');s.style.display='block';s.innerHTML='Você acertou '+hits+' de '+Q.length+' ('+Math.round(hits*10)+'%)<br><button class="r" onclick="location.reload()">Refazer</button>';s.scrollIntoView({behavior:'smooth'})}
  };
  d.appendChild(b);
 });
 const ex=document.createElement('div');ex.className='exp';d.appendChild(ex);
 box.appendChild(d);
});
</script></main></body></html>
