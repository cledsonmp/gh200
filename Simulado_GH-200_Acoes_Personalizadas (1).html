<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Simulado GH-200 sobre criação de ações personalizadas do GitHub">
  <title>Simulado GH-200 — Ações personalizadas</title>
  <style>
    :root{--ink:#24292f;--muted:#57606a;--line:#d0d7de;--soft:#f6f8fa;--blue:#0969da;--blue-soft:#ddf4ff;--green:#1a7f37;--green-soft:#dafbe1;--red:#cf222e;--red-soft:#ffebe9}
    *{box-sizing:border-box} body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    header{border-bottom:1px solid var(--line);padding:18px 24px}.top{max-width:940px;margin:auto;display:flex;gap:16px;align-items:center}.mark{width:46px;height:46px;border-radius:50%;background:#24292f;color:#fff;display:grid;place-items:center;font-weight:800}.title h1{font-size:20px;margin:0}.title p{margin:2px 0 0;color:var(--muted);font-size:14px}
    main{max-width:940px;margin:30px auto;padding:0 24px}.meta{display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:14px;margin-bottom:9px}.bar{height:8px;background:#eaeef2;border-radius:99px;overflow:hidden;margin-bottom:28px}.bar span{display:block;height:100%;background:var(--blue);transition:.25s}
    .card{border:1px solid var(--line);border-radius:8px;padding:28px;box-shadow:0 1px 0 rgba(27,31,36,.04)}.eyebrow{color:var(--blue);font-weight:650;font-size:14px}.question{font-size:21px;line-height:1.38;margin:8px 0 22px}.options{display:grid;gap:12px}.option{display:flex;align-items:flex-start;gap:12px;padding:15px;border:1px solid var(--line);border-radius:6px;cursor:pointer;transition:.15s}.option:hover{border-color:#8c959f;background:var(--soft)}.option.selected{border:2px solid var(--blue);padding:14px;background:var(--blue-soft)}.option.correct{border:2px solid var(--green);padding:14px;background:var(--green-soft)}.option.wrong{border:2px solid var(--red);padding:14px;background:var(--red-soft)}.option.locked{cursor:default}.option input{margin-top:5px}.letter{font-weight:650;min-width:20px}
    .feedback{margin-top:20px;padding:16px 18px;border-radius:6px;border-left:5px solid var(--green);background:var(--green-soft)}.feedback.bad{border-left-color:var(--red);background:var(--red-soft)}.feedback h3{margin:0 0 5px;font-size:17px;color:var(--green)}.feedback.bad h3{color:var(--red)}.feedback p{margin:4px 0}.actions{display:flex;justify-content:flex-end;margin-top:24px}.btn{border:1px solid rgba(27,31,36,.15);border-radius:6px;padding:10px 20px;font-weight:650;cursor:pointer;background:#f6f8fa;color:var(--ink)}.btn.primary{background:#1f883d;color:#fff;border-color:#1f883d}.btn:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}
    .result{text-align:center}.score{font-size:54px;font-weight:750;margin:8px 0;color:var(--blue)}.status{font-size:21px;font-weight:650}.summary{color:var(--muted);margin-bottom:24px}.review{margin-top:28px;text-align:left;display:grid;gap:14px}.review-item{border:1px solid var(--line);border-left:5px solid var(--green);padding:17px;border-radius:6px}.review-item.wrong{border-left-color:var(--red)}.review-item h3{font-size:16px;margin:0 0 7px}.review-item p{margin:4px 0;color:var(--muted)}
    code{background:var(--soft);border:1px solid #afb8c1;border-radius:4px;padding:1px 5px;font:0.92em ui-monospace,SFMono-Regular,Consolas,monospace}.footer{text-align:center;color:var(--muted);font-size:13px;margin:26px 0}@media(max-width:640px){.card{padding:20px}.question{font-size:18px}.meta{flex-direction:column;gap:3px}}
  </style>
</head>
<body>
<header><div class="top"><div class="mark">GH</div><div class="title"><h1>Simulado de Certificação GH-200</h1><p>Módulo 6 — Criar uma ação personalizada do GitHub</p></div></div></header>
<main>
  <section id="quiz">
    <div class="meta"><span id="counter"></span><span>A correção aparece antes de avançar</span></div><div class="bar"><span id="progress"></span></div>
    <div class="card"><div class="eyebrow">QUESTÃO</div><h2 class="question" id="question"></h2><div class="options" id="options"></div><div id="feedback" class="feedback hidden"></div><div class="actions"><button class="btn primary" id="action" disabled>Próxima</button></div></div>
  </section>
  <section id="result" class="hidden"><div class="card result"><div class="eyebrow">RESULTADO FINAL</div><div class="score" id="score"></div><div class="status" id="status"></div><p class="summary" id="summary"></p><button class="btn primary" id="restart">Refazer simulado</button><div class="review" id="review"></div></div></section>
  <div class="footer">Simulado independente para estudo da certificação GitHub Actions (GH-200).</div>
</main>
<script>
const questions=[
{q:'Qual afirmação descreve corretamente uma ação personalizada do GitHub?',o:['É um workflow completo que só pode ser executado no repositório em que foi criado.','É um conjunto reutilizável de instruções que encapsula lógica para executar uma tarefa em workflows.','É um runner auto-hospedado configurado por meio do arquivo action.yml.','É um segredo de repositório usado para compartilhar scripts.'],a:1,e:'Uma ação personalizada encapsula uma tarefa específica e pode ser reutilizada em diferentes workflows e repositórios.'},
{q:'Qual arquivo é obrigatório na raiz de uma ação personalizada e define seus metadados?',o:['workflow.yml','package.json','action.yml','README.md'],a:2,e:'O arquivo action.yml define nome, descrição, entradas, saídas e a forma de execução da ação.'},
{q:'No action.yml, qual propriedade torna a entrada mensagem obrigatória?',o:[`inputs:\n  mensagem:\n    required: true`,`inputs:\n  mensagem:\n    mandatory: yes`,`with:\n  mensagem:\n    required: true`,`env:\n  mensagem:\n    required: true`],a:0,e:'As entradas são declaradas em inputs; a propriedade required: true indica que o consumidor deve fornecer o valor.'},
{q:'Uma equipe quer combinar vários comandos shell já existentes sem criar uma imagem de contêiner nem compilar JavaScript. Qual tipo de ação é mais adequado?',o:['Ação JavaScript','Ação Docker','Ação Composite','Workflow agendado'],a:2,e:'A ação Composite agrupa etapas, comandos shell e outras ações em uma unidade reutilizável e usa using: composite.'},
{q:'Qual valor da propriedade runs.using identifica uma ação executada em um contêiner Docker?',o:['container','docker','composite','node16'],a:1,e:'Ações Docker usam runs.using: docker e normalmente informam a imagem ou o Dockerfile que será executado.'},
{q:'Uma ação JavaScript contém lógica mais complexa e será executada diretamente pelo runtime Node.js do runner. Qual configuração representa esse tipo?',o:[`runs:\n  using: 'composite'`,`runs:\n  using: 'docker'`,`runs:\n  using: 'node16'`,`runs:\n  using: 'bash'`],a:2,e:'Ações JavaScript declaram uma versão suportada do Node.js em runs.using e indicam o arquivo principal em runs.main.'},
{q:'Uma saída chamada resultado deve receber o valor produzido por uma etapa cujo id é definir-saida. Qual expressão está correta?',o:['${{ outputs.definir-saida.msg }}','${{ steps.definir-saida.outputs.msg }}','${{ jobs.definir-saida.msg }}','${{ inputs.definir-saida.outputs.msg }}'],a:1,e:'Saídas de etapas são referenciadas pelo contexto steps, seguido do id da etapa, outputs e o nome da saída.'},
{q:'Como um workflow no mesmo repositório usa uma ação local armazenada em .github/actions/minha-acao?',o:['uses: seu-usuario/minha-acao@local','run: .github/actions/minha-acao','uses: ./.github/actions/minha-acao','uses: ghcr.io/minha-acao'],a:2,e:'Uma ação local é referenciada por caminho relativo iniciado por ./, como uses: ./.github/actions/minha-acao.'},
{q:'Qual prática permite que consumidores usem uma versão estável publicada da ação?',o:['Referenciar sempre o branch de desenvolvimento sem versão.','Publicar tags como v1 ou v1.0.0 e usar uses: proprietario/acao@v1.','Copiar o action.yml para cada workflow consumidor.','Armazenar a versão apenas no README.md.'],a:1,e:'Tags de versão fornecem referências explícitas e previsíveis, por exemplo proprietario/acao@v1.'},
{q:'Qual conjunto reúne boas práticas para manter uma ação personalizada?',o:['Aceitar qualquer entrada, ocultar a documentação e usar sempre a mesma tag.','Manter múltiplas responsabilidades, executar scripts sem validação e evitar versões.','Usar nomes claros, documentar inputs e outputs, validar entradas e manter a ação focada.','Depender de segredos fixos no código para simplificar a execução.'],a:2,e:'Clareza, documentação, validação, foco, segurança e versionamento tornam a ação confiável e reutilizável.'}
];
let current=0,selected=null,revealed=false,answers=[];const $=id=>document.getElementById(id);const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('\n','<br>');
function render(){const x=questions[current];$('counter').textContent=`Questão ${current+1} de ${questions.length}`;$('progress').style.width=`${(current+1)/questions.length*100}%`;$('question').textContent=x.q;$('feedback').className='feedback hidden';$('feedback').innerHTML='';$('options').innerHTML=x.o.map((v,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"><span class="letter">${String.fromCharCode(65+i)}.</span><span>${esc(v)}</span></label>`).join('');document.querySelectorAll('input[name=answer]').forEach(el=>el.onchange=()=>{if(revealed)return;selected=+el.value;document.querySelectorAll('.option').forEach((n,i)=>n.classList.toggle('selected',i===selected));$('action').disabled=false});$('action').textContent='Próxima';$('action').disabled=true}
function reveal(){revealed=true;answers[current]=selected;const x=questions[current],ok=selected===x.a;document.querySelectorAll('.option').forEach((n,i)=>{n.classList.remove('selected');n.classList.add('locked');if(i===x.a)n.classList.add('correct');else if(i===selected)n.classList.add('wrong');n.querySelector('input').disabled=true});const f=$('feedback');f.className=`feedback ${ok?'':'bad'}`;f.innerHTML=`<h3>${ok?'Resposta correta':'Resposta incorreta'}</h3><p><strong>Alternativa correta: ${String.fromCharCode(65+x.a)}.</strong> ${esc(x.o[x.a])}</p><p>${x.e}</p>`;$('action').textContent=current===questions.length-1?'Ver resultado':'Continuar';$('action').disabled=false}
function advance(){if(!revealed){reveal();return}if(current<questions.length-1){current++;selected=null;revealed=false;render();window.scrollTo({top:0,behavior:'smooth'})}else finish()}
function finish(){const hits=answers.reduce((n,v,i)=>n+(v===questions[i].a),0),pct=Math.round(hits/questions.length*100);$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=`${pct}%`;$('status').textContent=pct>=70?'Desempenho satisfatório':'Continue revisando';$('summary').textContent=`Você acertou ${hits} de ${questions.length} questões.`;$('review').innerHTML=questions.map((x,i)=>{const ok=answers[i]===x.a;return `<article class="review-item ${ok?'':'wrong'}"><h3>${i+1}. ${x.q}</h3><p><strong>${ok?'Correta':'Incorreta'}.</strong> Resposta certa: ${String.fromCharCode(65+x.a)}. ${esc(x.o[x.a])}</p><p>${x.e}</p></article>`}).join('');window.scrollTo({top:0,behavior:'smooth'})}
$('action').onclick=advance;$('restart').onclick=()=>{current=0;selected=null;revealed=false;answers=[];$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render();window.scrollTo(0,0)};render();
</script>
</body>
</html>
