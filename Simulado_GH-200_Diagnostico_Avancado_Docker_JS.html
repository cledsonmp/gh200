<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulado GH-200 — Diagnóstico avançado de ações</title><style>
:root{--ink:#24292f;--muted:#57606a;--line:#d0d7de;--soft:#f6f8fa;--blue:#0969da;--bs:#ddf4ff;--green:#1a7f37;--gs:#dafbe1;--red:#cf222e;--rs:#ffebe9}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{border-bottom:1px solid var(--line);padding:18px 24px}.top{max-width:940px;margin:auto;display:flex;gap:16px;align-items:center}.mark{width:46px;height:46px;border-radius:50%;background:#24292f;color:#fff;display:grid;place-items:center;font-weight:800}.title h1{font-size:20px;margin:0}.title p{margin:2px 0 0;color:var(--muted);font-size:14px}main{max-width:940px;margin:30px auto;padding:0 24px}.meta{display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:14px;margin-bottom:9px}.bar{height:8px;background:#eaeef2;border-radius:99px;overflow:hidden;margin-bottom:28px}.bar span{display:block;height:100%;background:var(--blue);transition:.25s}.card{border:1px solid var(--line);border-radius:8px;padding:28px}.eyebrow{color:var(--blue);font-weight:650;font-size:14px}.question{font-size:21px;line-height:1.38;margin:8px 0 18px}.hintbox{margin:0 0 18px;padding:12px 14px;background:#fff8c5;border:1px solid #d4a72c;border-radius:6px;color:#633c01}.hint-btn{margin:0 0 18px;border:0;background:none;color:var(--blue);font-weight:650;cursor:pointer;padding:0}.options{display:grid;gap:12px}.option{display:flex;align-items:flex-start;gap:12px;padding:15px;border:1px solid var(--line);border-radius:6px;cursor:pointer;white-space:pre-wrap}.option:hover{border-color:#8c959f;background:var(--soft)}.option.selected{border:2px solid var(--blue);padding:14px;background:var(--bs)}.option.correct{border:2px solid var(--green);padding:14px;background:var(--gs)}.option.wrong{border:2px solid var(--red);padding:14px;background:var(--rs)}.option.locked{cursor:default}.option input{margin-top:5px}.letter{font-weight:650;min-width:20px}.feedback{margin-top:20px;padding:16px 18px;border-radius:6px;border-left:5px solid var(--green);background:var(--gs)}.feedback.bad{border-left-color:var(--red);background:var(--rs)}.feedback h3{margin:0 0 5px;font-size:17px;color:var(--green)}.feedback.bad h3{color:var(--red)}.feedback p{margin:4px 0}.actions{display:flex;justify-content:flex-end;margin-top:24px}.btn{border:1px solid rgba(27,31,36,.15);border-radius:6px;padding:10px 20px;font-weight:650;cursor:pointer;background:#f6f8fa}.btn.primary{background:#1f883d;color:#fff;border-color:#1f883d}.btn:disabled{opacity:.45;cursor:not-allowed}.hidden{display:none!important}.result{text-align:center}.score{font-size:54px;font-weight:750;margin:8px 0;color:var(--blue)}.status{font-size:21px;font-weight:650}.summary{color:var(--muted);margin-bottom:24px}.review{margin-top:28px;text-align:left;display:grid;gap:14px}.review-item{border:1px solid var(--line);border-left:5px solid var(--green);padding:17px;border-radius:6px}.review-item.wrong{border-left-color:var(--red)}.review-item h3{font-size:16px;margin:0 0 7px}.review-item p{margin:4px 0;color:var(--muted)}.footer{text-align:center;color:var(--muted);font-size:13px;margin:26px 0}@media(max-width:640px){.card{padding:20px}.question{font-size:18px}.meta{flex-direction:column;gap:3px}}
</style></head><body><header><div class="top"><div class="mark">GH</div><div class="title"><h1>Simulado de Certificação GH-200</h1><p>Módulo 6 — Diagnóstico avançado de ações Docker e JavaScript</p></div></div></header><main><section id="quiz"><div class="meta"><span id="counter"></span><span>Correção antes de avançar</span></div><div class="bar"><span id="progress"></span></div><div class="card"><div class="eyebrow">QUESTÃO</div><h2 class="question" id="question"></h2><button id="hintBtn" class="hint-btn">Ver dica</button><div id="hint" class="hintbox hidden"></div><div class="options" id="options"></div><div id="feedback" class="feedback hidden"></div><div class="actions"><button class="btn primary" id="action" disabled>Próxima</button></div></div></section><section id="result" class="hidden"><div class="card result"><div class="eyebrow">RESULTADO FINAL</div><div class="score" id="score"></div><div class="status" id="status"></div><p class="summary" id="summary"></p><button class="btn primary" id="restart">Refazer simulado</button><div class="review" id="review"></div></div></section><div class="footer">Simulado independente para estudo da certificação GitHub Actions (GH-200).</div></main><script>
const questions=[
{q:'Uma ação Docker conclui o build, mas falha imediatamente ao iniciar. O log mostra que nenhum processo executável foi encontrado. Qual investigação deve vir primeiro?',o:['Revisar a chave do actions/cache','Confirmar se ENTRYPOINT ou CMD aponta corretamente para o executável','Ativar apenas core.debug() no index.js','Alterar o input para INPUT_NAME'],a:1,h:'O contêiner foi criado; a falha ocorre antes de sua lógica começar.',e:'Quando o contêiner não consegue iniciar, a primeira verificação é a configuração de ENTRYPOINT ou CMD no Dockerfile.'},
{q:'O Dockerfile contém ENTRYPOINT ["/entrypoint.sh"]. O arquivo existe na imagem, mas o log mostra “permission denied”. Qual alteração corrige a causa sem mascarar o erro?',o:['Adicionar RUN chmod +x /entrypoint.sh durante o build','Executar o workflow com continue-on-error','Trocar ENTRYPOINT por uma variável INPUT_ENTRYPOINT','Ativar ACTIONS_RUNNER_DEBUG e manter a imagem igual'],a:0,h:'Existência do arquivo e permissão de execução são condições diferentes.',e:'RUN chmod +x concede permissão de execução ao script dentro da imagem; continue-on-error apenas esconderia a falha.'},
{q:'Uma ação Docker recebe with: name: test, mas o entrypoint imprime uma string vazia. O action.yml declara o input corretamente. Qual leitura deve ser usada pelo código da ação?',o:['GITHUB_NAME','process.env.NAME','process.env.INPUT_NAME','process.env.WITH_NAME'],a:2,h:'O GitHub expõe inputs de ações Docker com um prefixo padronizado.',e:'Inputs são disponibilizados como variáveis INPUT_<NOME>; portanto, name é lido em process.env.INPUT_NAME.'},
{q:'Uma ação Docker acessa uma API externa. Falhas transitórias ocorrem somente em alguns runners, embora a URL esteja correta. Qual resposta combina diagnóstico e resiliência?',o:['Remover o ENTRYPOINT e chamar a API no action.yml','Trocar INPUT_URL por GITHUB_WORKSPACE','Usar chmod +x no endereço da API','Validar conectividade/configuração de rede e implementar repetição controlada'],a:3,h:'O problema é intermitente e envolve um serviço fora do contêiner.',e:'Deve-se verificar a rede do ambiente e aplicar uma política de retry limitada para falhas transitórias, sem repetir indefinidamente.'},
{q:'Uma action JavaScript recebe undefined em core.getInput("token"), mas o workflow fornece with: api-token. Qual é a correção mais precisa?',o:['Renomear a leitura para core.getInput("api-token") e conferir esse input no action.yml','Usar process.env.GITHUB_WORKSPACE como token','Ativar ACTIONS_RUNNER_DEBUG para criar o input','Empacotar com ncc sem alterar os nomes'],a:0,h:'Compare literalmente o identificador declarado, enviado e lido.',e:'O mesmo nome deve ser usado no action.yml, em with e em core.getInput. A divergência token versus api-token causa undefined ou valor vazio.'},
{q:'O código contém core.debug("valor calculado"), mas a mensagem não aparece nos logs normais. Qual configuração resolve especificamente isso?',o:['Definir ACTIONS_RUNNER_DEBUG=true apenas','Substituir core.debug por core.setFailed','Adicionar INPUT_DEBUG=true ao Dockerfile','Definir ACTIONS_STEP_DEBUG=true em Secrets and variables → Actions'],a:3,h:'Há um controle de depuração específico para o nível das etapas.',e:'core.debug só é exibido quando ACTIONS_STEP_DEBUG=true. ACTIONS_RUNNER_DEBUG fornece diagnóstico adicional do executor.'},
{q:'A equipe precisa investigar simultaneamente uma etapa JavaScript e detalhes internos do executor. Qual configuração fornece os dois níveis de diagnóstico?',o:['Somente ACTIONS_STEP_DEBUG=true','Somente ACTIONS_RUNNER_DEBUG=true','ACTIONS_STEP_DEBUG=true e ACTIONS_RUNNER_DEBUG=true','DEBUG=true e RUNNER_TRACE=true'],a:2,h:'Os dois controles têm escopos complementares.',e:'ACTIONS_STEP_DEBUG habilita logs detalhados das etapas; ACTIONS_RUNNER_DEBUG habilita diagnóstico do runner.'},
{q:'Uma ação abre ./templates/report.txt. Ela funciona ao ser executada na pasta do projeto, mas falha no runner porque o diretório corrente é diferente. Qual implementação é mais robusta?',o:['Montar o caminho a partir de __dirname','Adicionar console.log sem mudar o caminho','Mover o arquivo para o cache','Usar ACTIONS_STEP_DEBUG como caminho base'],a:0,h:'O caminho deve ser relativo à localização do código, não ao diretório corrente.',e:'__dirname permite resolver o arquivo em relação ao diretório do script, eliminando dependência do diretório de execução.'},
{q:'O passo actions/cache@v4 executa sem erro, porém nunca restaura o cache esperado. Qual verificação deve ser priorizada?',o:['ENTRYPOINT e CMD do Dockerfile','Nomes dos inputs do action.yml apenas','Valores de key e path configurados no cache','Permissão de execução do index.js'],a:2,h:'Uma restauração depende tanto da identidade quanto da localização dos arquivos armazenados.',e:'Chave incompatível impede o match, e path incorreto impede armazenar/restaurar o conteúdo desejado; ambos devem ser conferidos.'},
{q:'Depois da publicação, uma action JavaScript falha com “Cannot find module”, embora tenha funcionado no ambiente do desenvolvedor. Qual combinação previne esse problema e melhora o tratamento de falhas?',o:['Empacotar com @vercel/ncc e envolver a execução em try/catch com core.setFailed','Ativar somente console.log e remover package.json','Converter todos os inputs em variáveis GITHUB_*','Executar chmod +x no action.yml'],a:0,h:'Uma medida inclui dependências; a outra comunica a falha corretamente ao workflow.',e:'ncc gera um artefato único com dependências, enquanto try/catch com core.setFailed evita falhas silenciosas e registra o erro.'}
];
let current=0,selected=null,revealed=false,answers=[];const $=id=>document.getElementById(id);const safe=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
function render(){const x=questions[current];$('counter').textContent=`Questão ${current+1} de 10`;$('progress').style.width=`${(current+1)*10}%`;$('question').textContent=x.q;$('hint').textContent=x.h;$('hint').classList.add('hidden');$('hintBtn').textContent='Ver dica';$('hintBtn').classList.remove('hidden');$('feedback').className='feedback hidden';$('options').innerHTML=x.o.map((v,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"><span class="letter">${'ABCD'[i]}.</span><span>${safe(v)}</span></label>`).join('');document.querySelectorAll('input[name=answer]').forEach(el=>el.onchange=()=>{selected=+el.value;document.querySelectorAll('.option').forEach((n,i)=>n.classList.toggle('selected',i===selected));$('action').disabled=false});$('action').textContent='Próxima';$('action').disabled=true}
$('hintBtn').onclick=()=>{$('hint').classList.toggle('hidden');$('hintBtn').textContent=$('hint').classList.contains('hidden')?'Ver dica':'Ocultar dica'};
function reveal(){revealed=true;answers[current]=selected;const x=questions[current],ok=selected===x.a;document.querySelectorAll('.option').forEach((n,i)=>{n.classList.remove('selected');n.classList.add('locked');n.querySelector('input').disabled=true;if(i===x.a)n.classList.add('correct');else if(i===selected)n.classList.add('wrong')});$('hintBtn').classList.add('hidden');$('hint').classList.add('hidden');const f=$('feedback');f.className=`feedback ${ok?'':'bad'}`;f.innerHTML=`<h3>${ok?'Resposta correta':'Resposta incorreta'}</h3><p><strong>Alternativa correta: ${'ABCD'[x.a]}.</strong> ${safe(x.o[x.a])}</p><p>${x.e}</p>`;$('action').textContent=current===9?'Ver resultado':'Continuar'}
function advance(){if(!revealed)return reveal();if(current<9){current++;selected=null;revealed=false;render();scrollTo({top:0,behavior:'smooth'})}else finish()}
function finish(){const hits=answers.reduce((n,v,i)=>n+(v===questions[i].a),0),pct=hits*10;$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=pct+'%';$('status').textContent=pct>=70?'Desempenho satisfatório':'Continue revisando';$('summary').textContent=`Você acertou ${hits} de 10 questões.`;$('review').innerHTML=questions.map((x,i)=>`<article class="review-item ${answers[i]===x.a?'':'wrong'}"><h3>${i+1}. ${x.q}</h3><p><strong>${answers[i]===x.a?'Correta':'Incorreta'}.</strong> Resposta: ${'ABCD'[x.a]}. ${safe(x.o[x.a])}</p><p>${x.e}</p></article>`).join('');scrollTo({top:0,behavior:'smooth'})}
$('action').onclick=advance;$('restart').onclick=()=>{current=0;selected=null;revealed=false;answers=[];$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render();scrollTo(0,0)};render();
</script></body></html>
